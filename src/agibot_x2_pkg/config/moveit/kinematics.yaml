# Plugin di cinematica inversa di MoveIt: NON usato da pick_test_book (i
# goal sono a giunti, l'IK e' quella di arm_kinematics.py). Il file serve
# perche' MoveItConfigsBuilder lo esige; KDL sui soli bracci (catene seriali).
right_arm_only:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
left_arm_only:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
