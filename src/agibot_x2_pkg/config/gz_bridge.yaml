# cameras

# Camera della testa: foto della libreria e ISBN in mano
- ros_topic_name: "/head_camera/trigger"
  gz_topic_name: "/head_camera/trigger"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: "ROS_TO_GZ"

- ros_topic_name: "head_camera/camera_info"
  gz_topic_name: "head_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"

