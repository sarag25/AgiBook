controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller braccio sinistro (per pick-and-place)
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller braccio destro
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller testa
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller vita
    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Roll della vita (2026-09-06): waist_roll_joint e' in ros2_control ma
    # non era in NESSUN controller -> giunto libero che cedeva sotto il peso
    # del braccio teso (-0.08 rad misurati = mano spostata di ~5 cm rispetto
    # all'IK, che assume roll 0 -> il libro attaccato travolgeva i vicini).
    # Un JTC dedicato lo tiene a 0 senza toccare i client di waist_controller
    # (che restano a 2 giunti).
    waist_roll_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Camminata cinematica (2026-09-13, vedi Gazebo.md "Camminata"):
    # base_controller muove i 4 giunti virtuali world->pelvis
    # (x2_hand_gazebo.urdf), legs_controller anima i 12 giunti delle gambe
    # (prima in ros2_control ma senza controller: gambe rigide a 0).
    # Entrambi pilotati da agibot_x2_pkg_py/walk_to_shelf.py.
    base_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    legs_controller:
      type: joint_trajectory_controller/JointTrajectoryController


left_arm_controller:
  ros__parameters:
    # 2026-09-18 (MoveIt): move_group manda traiettorie con i 5 giunti del
    # braccio senza le dita; con questo flag il JTC le accetta e tiene le
    # dita dove stanno. Non cambia nulla per i goal a 7 giunti di sempre.
    allow_partial_joints_goal: true
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
      - left_gripper_left_finger_joint
      - left_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    # 2026-09-18 (MoveIt): move_group manda traiettorie con i 5 giunti del
    # braccio senza le dita; con questo flag il JTC le accetta e tiene le
    # dita dove stanno. Non cambia nulla per i goal a 7 giunti di sempre.
    allow_partial_joints_goal: true
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
      - right_gripper_left_finger_joint
      - right_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

head_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

waist_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    joints:
      - waist_yaw_joint
      - waist_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

waist_roll_controller:
  ros__parameters:
    joints:
      - waist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

base_controller:
  ros__parameters:
    joints:
      - base_x_joint
      - base_y_joint
      - base_z_joint
      - base_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

legs_controller:
  ros__parameters:
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
