controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller braccio sinistro (per pick-and-place)
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller braccio destro
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller testa
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller vita
    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller gripper sinistro/destro (presa, 2026-08-11)
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

head_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

waist_controller:
  ros__parameters:
    joints:
      - waist_yaw_joint
      - waist_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_left_finger_joint
      - left_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_gripper_controller:
  ros__parameters:
    joints:
      - right_gripper_left_finger_joint
      - right_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
