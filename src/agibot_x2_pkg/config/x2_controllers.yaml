controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller braccio sinistro (per pick-and-place)
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller braccio destro
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller testa
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller vita
    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Roll della vita (2026-09-06): waist_roll_joint e' in ros2_control ma
    # non era in NESSUN controller -> giunto libero che cedeva sotto il peso
    # del braccio teso (-0.08 rad misurati = mano spostata di ~5 cm rispetto
    # all'IK, che assume roll 0 -> il libro attaccato travolgeva i vicini).
    # Un JTC dedicato lo tiene a 0 senza toccare i client di waist_controller
    # (che restano a 2 giunti).
    waist_roll_controller:
      type: joint_trajectory_controller/JointTrajectoryController


left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
      - left_gripper_left_finger_joint
      - left_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
      - right_gripper_left_finger_joint
      - right_gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

head_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

waist_controller:
  ros__parameters:
    joints:
      - waist_yaw_joint
      - waist_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

waist_roll_controller:
  ros__parameters:
    joints:
      - waist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
